name: KFFI CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wayland-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Install Wayland integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            grim \
            libwayland-bin \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libwayland-server0 \
            sway \
            wayland-protocols
      - name: Run Wayland integration test
        run: scripts/run-wayland-integration.sh
      - name: Upload Wayland integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayland-integration
          path: kffi-wayland/build/wayland-integration/**
          if-no-files-found: warn

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - name: Activate MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Run JVM and Android host tests
        run: ./gradlew :kffi:jvmTest :kffi:testAndroidHostTest
      - name: Compile Apple Native callback token codecs
        if: matrix.os == 'macos-latest'
        run: >-
          ./gradlew
          :kffi:compileKotlinIosX64 :kffi:compileKotlinIosArm64 :kffi:compileKotlinIosSimulatorArm64
          :kffi:compileKotlinMacosArm64 :kffi:compileKotlinMacosX64
      - name: Compile Linux Native callback token codecs
        if: matrix.os == 'ubuntu-latest'
        run: >-
          ./gradlew
          :kffi:compileKotlinLinuxX64 :kffi:compileKotlinLinuxArm64
      - name: Compile MinGW callback token codecs
        if: matrix.os == 'windows-latest'
        run: ./gradlew :kffi:compileKotlinMingwX64
      - name: Run macOS Native tests
        if: matrix.os == 'macos-latest'
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            ./gradlew :kffi:macosArm64Test
          else
            ./gradlew :kffi:macosX64Test
          fi
      - name: Run Linux Native tests
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :kffi:linuxX64Test
      - name: Run Windows Native tests
        if: matrix.os == 'windows-latest'
        run: ./gradlew :kffi:mingwX64Test

  android-device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Set up Android SDK and NDK
        uses: ./.github/actions/setup-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :kffi:connectedAndroidDeviceTest
